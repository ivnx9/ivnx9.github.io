<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lloyd Laboratories Interview Q&A</title>
	<style>
	* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #0a66c2;
    --blue-dark: #004182;
    --blue-light: #e8f3ff;

    --background: #f3f2ef;
    --white: #ffffff;

    --text: #1d2226;
    --muted: #666666;
    --border: #d9d9d9;

    --sidebar-width: 420px;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--background);
    color: var(--text);

    min-height: 100vh;
}


/* =========================
   APP
========================= */

.app {
    display: flex;
    height: 100vh;
    overflow: hidden;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);

    background: var(--white);
    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    height: 100vh;
}


/* HEADER */

.sidebar-header {
    padding: 24px;

    display: flex;
    align-items: center;
    gap: 14px;

    border-bottom: 1px solid var(--border);
}

.logo {
    width: 44px;
    height: 44px;

    border-radius: 8px;

    background: var(--blue);
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
    font-weight: 700;
}

.sidebar-header h1 {
    font-size: 19px;
    font-weight: 650;
}

.sidebar-header p {
    margin-top: 3px;

    color: var(--muted);

    font-size: 13px;
}


/* SEARCH */

.search-box {
    margin: 18px 18px 10px;

    height: 42px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: #f8f8f8;

    display: flex;
    align-items: center;

    padding: 0 12px;

    transition: 0.2s;
}

.search-box:focus-within {
    border-color: var(--blue);
    background: white;

    box-shadow:
        0 0 0 2px rgba(10, 102, 194, 0.08);
}

.search-box span {
    font-size: 23px;
    color: #777;

    margin-right: 8px;
}

.search-box input {
    border: 0;
    outline: none;

    background: transparent;

    width: 100%;

    font-size: 14px;
    color: var(--text);
}


/* COUNT */

.question-count {
    padding: 8px 20px 12px;

    color: var(--muted);

    font-size: 12px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: 0.5px;
}


/* QUESTIONS */

.question-list {
    flex: 1;

    overflow-y: auto;

    padding-bottom: 20px;
}

.question-item {
    width: 100%;

    border: 0;
    border-left: 3px solid transparent;

    background: transparent;

    text-align: left;

    padding: 15px 20px;

    cursor: pointer;

    display: flex;
    gap: 13px;

    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}

.question-item:hover {
    background: #f5f7f9;
}

.question-item.active {
    background: var(--blue-light);
    border-left-color: var(--blue);
}

.question-number-small {
    flex-shrink: 0;

    width: 28px;
    height: 28px;

    border-radius: 50%;

    background: #eef0f2;

    color: #555;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
    font-weight: 700;
}

.question-item.active .question-number-small {
    background: var(--blue);
    color: white;
}

.question-text {
    color: #333;

    font-size: 14px;
    line-height: 1.4;

    font-weight: 500;
}

.question-item.active .question-text {
    color: var(--blue-dark);
    font-weight: 650;
}


/* =========================
   CONTENT
========================= */

.content {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;

    height: 100vh;
}


/* HEADER */

.content-header {
    background: white;

    min-height: 94px;

    border-bottom: 1px solid var(--border);

    padding: 20px 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.eyebrow {
    display: block;

    color: var(--blue);

    font-size: 11px;
    font-weight: 750;

    letter-spacing: 1.2px;

    margin-bottom: 6px;
}

.content-header h2 {
    font-size: 25px;
    line-height: 1.25;

    font-weight: 650;

    max-width: 850px;
}


/* COPY BUTTON */

.copy-btn {
    flex-shrink: 0;

    border: 1px solid #b8b8b8;

    background: white;

    color: #333;

    padding: 9px 17px;

    border-radius: 18px;

    font-size: 13px;
    font-weight: 650;

    cursor: pointer;

    transition: 0.15s;
}

.copy-btn:hover {
    background: #f3f3f3;
}

.copy-btn.copied {
    background: #057642;
    border-color: #057642;
    color: white;
}


/* =========================
   ANSWER
========================= */

.answer-area {
    flex: 1;

    overflow-y: auto;

    padding: 40px 42px 30px;
}

.question-number {
    color: var(--muted);

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 1px;

    margin-bottom: 10px;
}

.answer-card {
    max-width: 900px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 30px 34px;

    box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.03);
}

.answer-label {
    display: flex;
    align-items: center;

    gap: 8px;

    color: var(--muted);

    font-size: 12px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 0.6px;

    padding-bottom: 20px;

    border-bottom: 1px solid #eeeeee;

    margin-bottom: 25px;
}

.answer-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--blue);
}

.answer-text {
    white-space: pre-line;

    font-size: 17px;

    line-height: 1.75;

    color: #252525;
}


/* =========================
   NAVIGATION
========================= */

.navigation {
    background: white;

    border-top: 1px solid var(--border);

    min-height: 74px;

    padding: 14px 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.nav-btn {
    border: 1px solid #c8c8c8;

    background: white;

    color: #333;

    border-radius: 20px;

    padding: 9px 18px;

    display: flex;
    align-items: center;

    gap: 8px;

    font-size: 13px;
    font-weight: 650;

    cursor: pointer;

    transition: 0.15s;
}

.nav-btn:hover:not(:disabled) {
    background: #f3f3f3;
}

.nav-btn.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
}

.nav-btn.primary:hover:not(:disabled) {
    background: var(--blue-dark);
}

.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.progress {
    color: var(--muted);

    font-size: 13px;
    font-weight: 600;
}


/* =========================
   EMPTY SEARCH
========================= */

.no-results {
    padding: 30px 20px;

    text-align: center;

    color: var(--muted);

    font-size: 14px;
}


/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #c8c8c8;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #aaa;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    :root {
        --sidebar-width: 330px;
    }

    .content-header {
        padding: 18px 25px;
    }

    .answer-area {
        padding: 30px 25px;
    }

    .navigation {
        padding: 14px 25px;
    }

    .answer-card {
        padding: 25px;
    }
}


@media (max-width: 700px) {

    .app {
        height: auto;
        min-height: 100vh;

        flex-direction: column;
        overflow: visible;
    }

    .sidebar {
        width: 100%;
        min-width: 0;
        height: auto;

        border-right: 0;
        border-bottom: 1px solid var(--border);
    }

    .question-list {
        max-height: 280px;
    }

    .content {
        height: auto;
        min-height: 600px;
    }

    .content-header {
        padding: 20px;
        align-items: flex-start;
    }

    .content-header h2 {
        font-size: 20px;
    }

    .copy-btn {
        display: none;
    }

    .answer-area {
        padding: 25px 20px;
    }

    .answer-card {
        padding: 22px;
    }

    .answer-text {
        font-size: 16px;
        line-height: 1.7;
    }

    .navigation {
        padding: 14px 20px;
    }
}
	</style>
</head>

/* =========================
   ELEMENTS
========================= */

const questionList = document.getElementById("questionList");
const searchInput = document.getElementById("searchInput");

const questionTitle = document.getElementById("questionTitle");
const questionNumber = document.getElementById("questionNumber");
const answerText = document.getElementById("answerText");

const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");

const currentIndex = document.getElementById("currentIndex");
const totalQuestions = document.getElementById("totalQuestions");

const visibleCount = document.getElementById("visibleCount");
const copyButton = document.getElementById("copyButton");


/* =========================
   STATE
========================= */

let filteredQuestions = [...questions];
let currentQuestionIndex = 0;


/* =========================
   RENDER QUESTION LIST
========================= */

function renderQuestionList() {

    questionList.innerHTML = "";

    if (filteredQuestions.length === 0) {

        questionList.innerHTML = `
            <div class="no-results">
                No questions found.
            </div>
        `;

        visibleCount.textContent = "0";
        return;
    }

    filteredQuestions.forEach((item, index) => {

        const button = document.createElement("button");

        button.className = "question-item";

        if (index === currentQuestionIndex) {
            button.classList.add("active");
        }

        button.innerHTML = `
            <span class="question-number-small">
                ${item.number}
            </span>

            <span class="question-text">
                ${item.question}
            </span>
        `;

        button.addEventListener("click", () => {

            currentQuestionIndex = index;

            displayQuestion();

        });

        questionList.appendChild(button);

    });

    visibleCount.textContent = filteredQuestions.length;
}


/* =========================
   DISPLAY QUESTION
========================= */

function displayQuestion() {

    if (filteredQuestions.length === 0) {
        return;
    }

    const item = filteredQuestions[currentQuestionIndex];

    questionTitle.textContent = item.question;

    questionNumber.textContent =
        `QUESTION ${item.number}`;

    answerText.textContent = item.answer;

    currentIndex.textContent =
        currentQuestionIndex + 1;

    totalQuestions.textContent =
        filteredQuestions.length;

    previousButton.disabled =
        currentQuestionIndex === 0;

    nextButton.disabled =
        currentQuestionIndex === filteredQuestions.length - 1;

    renderQuestionList();

    scrollActiveQuestionIntoView();
}


/* =========================
   SCROLL ACTIVE QUESTION
========================= */

function scrollActiveQuestionIntoView() {

    const activeQuestion =
        document.querySelector(".question-item.active");

    if (!activeQuestion) {
        return;
    }

    activeQuestion.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}


/* =========================
   NEXT
========================= */

function nextQuestion() {

    if (
        currentQuestionIndex <
        filteredQuestions.length - 1
    ) {

        currentQuestionIndex++;

        displayQuestion();
    }
}


/* =========================
   PREVIOUS
========================= */

function previousQuestion() {

    if (currentQuestionIndex > 0) {

        currentQuestionIndex--;

        displayQuestion();
    }
}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener("input", function () {

    const searchTerm =
        this.value
            .trim()
            .toLowerCase();

    filteredQuestions = questions.filter(item => {

        return (
            item.question
                .toLowerCase()
                .includes(searchTerm)
        );

    });

    currentQuestionIndex = 0;

    displayQuestion();

});


/* =========================
   COPY ANSWER
========================= */

copyButton.addEventListener("click", async function () {

    if (filteredQuestions.length === 0) {
        return;
    }

    const answer =
        filteredQuestions[currentQuestionIndex].answer;

    try {

        await navigator.clipboard.writeText(answer);

        copyButton.textContent = "Copied!";

        copyButton.classList.add("copied");

        setTimeout(() => {

            copyButton.textContent = "Copy Answer";

            copyButton.classList.remove("copied");

        }, 1600);

    } catch (error) {

        const textarea =
            document.createElement("textarea");

        textarea.value = answer;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        copyButton.textContent = "Copied!";

        copyButton.classList.add("copied");

        setTimeout(() => {

            copyButton.textContent = "Copy Answer";

            copyButton.classList.remove("copied");

        }, 1600);
    }

});


/* =========================
   NAVIGATION BUTTONS
========================= */

nextButton.addEventListener(
    "click",
    nextQuestion
);

previousButton.addEventListener(
    "click",
    previousQuestion
);


/* =========================
   KEYBOARD NAVIGATION
========================= */

document.addEventListener("keydown", function (event) {

    /*
       Don't navigate while typing
       in the search box.
    */

    if (
        document.activeElement === searchInput
    ) {
        return;
    }

    if (event.key === "ArrowDown") {

        event.preventDefault();

        nextQuestion();

    }

    if (event.key === "ArrowUp") {

        event.preventDefault();

        previousQuestion();

    }

});


/* =========================
   INITIALIZE
========================= */

totalQuestions.textContent =
    questions.length;

renderQuestionList();

displayQuestion();
</script>
</body>
</html>
